<!DOCTYPE html>
<html lang="en" class="khaos-page">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loading...</title>
    <link rel="icon" href="_khaos/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="stylesheet" href="_khaos/khaos.css" />
</head>

<body>
    <!--
    The page of every example: Khaos's default page, except that the example starts on its own.
    An example with sound or input is played from play/?click, which waits for Play: the browser lets
    a page play sound or read the keyboard only after a click.
  -->
    <div class="khaos-host" data-khaos-host data-khaos-state="loading">
        <canvas id="canvas" tabindex="-1"></canvas>

        <div class="khaos-screen" data-khaos-screen="loading" role="status">
            <img class="khaos-mark khaos-bob" src="_khaos/khaos.svg" alt="" />
            <div class="khaos-progress" aria-hidden="true"></div>
            <p class="khaos-status">Loading...</p>
            <p class="khaos-made-with">Made with Khaos</p>
        </div>

        <div class="khaos-screen" data-khaos-screen="ready">
            <img class="khaos-mark" src="_khaos/khaos.svg" alt="" />
            <button type="button" class="khaos-play" data-khaos-play>Play</button>
            <p class="khaos-hint" data-khaos-hint="alone">Click or press Enter</p>
            <p class="khaos-hint" data-khaos-hint="embedded">Click to play</p>
        </div>

        <div class="khaos-screen" data-khaos-screen="ended">
            <img class="khaos-mark" src="_khaos/khaos.svg" alt="" />
            <p class="khaos-thanks">Thanks for playing!</p>
            <button type="button" class="khaos-play" data-khaos-replay>Play again</button>
        </div>

        <div class="khaos-screen" data-khaos-screen="failed" role="alert">
            <p class="khaos-error" data-khaos-error-message>The example could not start.</p>
            <pre class="khaos-details" data-khaos-error-details></pre>
        </div>

        <button type="button" class="khaos-fullscreen" data-khaos-fullscreen title="Fullscreen" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                aria-hidden="true">
                <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
            </svg>
        </button>
    </div>
    <script type="module" src="_khaos/khaos.js" data-autostart="false"></script>
    <script type="module">
        Khaos.start({ clickToPlay: new URLSearchParams(window.location.search).has('click') }).catch(() => { });
    </script>
</body>

</html>
