name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: &paths
      - '.github/workflows/**'
      - 'src/**'
      - 'analyzers/**'
  push:
    branches: [main]
    paths: *paths
  schedule:
    - cron: '0 12 * * 2'
      timezone: America/Toronto

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  actions:
    name: Analyze actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions

  csharp:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: dotnet build khaos.slnx --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
