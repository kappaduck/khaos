name: Runtimes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['runtimes/**', '!runtimes/auto-update.cs']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: runtimes

jobs:
  build:
    name: Build ${{ matrix.platform }} runtimes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux, windows]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load versions
        run: grep -v '^#' utils/sdl.env >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          chmod +x scripts/dependencies.sh
          scripts/dependencies.sh

      - name: Build
        run: |
          chmod +x scripts/build-${{ matrix.platform }}.sh
          scripts/build-${{ matrix.platform }}.sh

      - name: Upload runtimes
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-runtimes
          path: runtimes/artifacts

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: runtimes/artifacts

      - name: Structure artifacts
        run: |
          mkdir -p runtimes/linux-x64/native runtimes/win-x64/native
          cp -r artifacts/linux-runtimes/runtimes/linux-x64/native/* runtimes/linux-x64/native/
          cp -r artifacts/windows-runtimes/runtimes/win-x64/native/* runtimes/win-x64/native/

      - name: Package
        run: dotnet pack package.nuspec --output .

      - name: Generate key
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ secrets.USER }}

      - name: Publish to NuGet
        run: dotnet nuget push KappaDuck.Quack.Runtimes*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --skip-duplicate
