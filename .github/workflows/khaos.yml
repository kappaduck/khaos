name: Khaos

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish ${{ github.event_name == 'release' && !github.event.release.prerelease && 'release' || 'beta' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ github.event_name == 'release' && !github.event.release.prerelease && 'nuget-release' || 'nuget-beta' }}
    permissions:
      contents: read
      id-token: write

    outputs:
      latest: ${{ steps.latest.outputs.latest }}
      previous: ${{ steps.latest.outputs.previous }}

    env:
      Channel: ${{ github.event_name == 'release' && !github.event.release.prerelease && 'release' || 'beta' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Read version
        id: versions
        run: echo "Khaos=$(dotnet msbuild src/Khaos/Khaos.csproj -getProperty:VersionPrefix)" >> "$GITHUB_OUTPUT"

      - name: Check the release tag
        if: github.event_name == 'release'
        env:
          Tag: ${{ github.event.release.tag_name }}
          Prefix: ${{ steps.versions.outputs.Khaos }}
        run: |
          if [[ "${Tag#v}" != "$Prefix" ]]; then
            echo "::error::The release tag is $Tag, but Directory.Build.props says $Prefix. Run tools/prepare-release.cs or fix the tag."
            exit 1
          fi

      - name: Check the release branch
        if: env.Channel == 'release'
        env:
          Tag: ${{ github.event.release.tag_name }}
        run: |
          version="${Tag#v}"
          line="${version%.*}"
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The release commit is on main."
          elif git rev-parse --verify --quiet "origin/release/$line" > /dev/null \
            && git merge-base --is-ancestor "$GITHUB_SHA" "origin/release/$line"; then
            echo "The release commit is on release/$line."
          else
            echo "::error::The release commit $GITHUB_SHA is on neither main nor release/$line. Create the release from main, or from release/$line for a patch, after the release PR is merged."
            exit 1
          fi

      - name: Check the release is the latest
        id: latest
        if: env.Channel == 'release'
        env:
          Tag: ${{ github.event.release.tag_name }}
        run: |
          version="${Tag#v}"
          stable=$(git tag --list | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          highest=$(tail -n 1 <<< "$stable")
          previous=$(printf '%s\n%s\n' "$stable" "$version" | sort -V -u | grep -x -F -B 1 "$version" | head -n 1)
          [[ "$previous" == "$version" ]] && previous=""
          echo "previous=${previous:+v$previous}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == "$highest" ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$version is older than $highest, so the documentation site stays on $highest."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version
        id: package
        env:
          Khaos: ${{ steps.versions.outputs.Khaos }}
        run: |
          chmod +x tools/resolve-version.sh
          tools/resolve-version.sh KappaDuck.Khaos "$Khaos" "$Channel"

      - name: Test
        if: env.Channel != 'release'
        run: dotnet test --solution tests.slnf --configuration Release

      - name: Build
        env:
          Suffix: ${{ steps.package.outputs.Suffix }}
        run: dotnet build packages.slnf --configuration Release -p:VersionSuffix="$Suffix"

      - name: Package
        env:
          Suffix: ${{ steps.package.outputs.Suffix }}
        run: dotnet pack packages.slnf --no-build --configuration Release --output artifacts/packages -p:VersionSuffix="$Suffix"

      - name: Check packages
        env:
          Version: ${{ steps.package.outputs.Version }}
        run: |
          ls artifacts/packages
          for id in KappaDuck.Khaos KappaDuck.Khaos.Templates; do
            test -f "artifacts/packages/$id.$Version.nupkg" || { echo "::error::$id was not packed"; exit 1; }
          done

      - name: Generate key
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ vars.USER }}

      - name: Publish to NuGet
        env:
          ApiKey: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$ApiKey" --skip-duplicate

  docs:
    name: Documentation
    needs: publish
    if: github.event_name == 'release' && !github.event.release.prerelease && needs.publish.outputs.latest == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/docs.yml
    with:
      stage: production
      benchmarks: true
      benchmarks-base: ${{ needs.publish.outputs.previous }}
    secrets: inherit
