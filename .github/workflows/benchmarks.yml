name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      filter:
        description: BenchmarkDotNet filter (--filter), for example *Renderer*
        type: string
        default: '*'
      runtimes:
        description: Runtimes to measure (--runtimes), separated by spaces; the first one is the baseline
        type: string
        default: net11.0 nativeaot11.0
      base:
        description: A tag or branch to compare with (v0.1.0, main), measured on the same runner; empty to skip
        type: string
        default: ''
      strict:
        description: Fail when a benchmark allocates more than in the base
        type: boolean
        default: true
  workflow_call:
    inputs:
      filter:
        type: string
        default: '*'
      runtimes:
        type: string
        default: net11.0 nativeaot11.0
      base:
        type: string
        default: ''
      strict:
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout the base
        if: inputs.base != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base }}
          path: base
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          native-aot: ${{ contains(inputs.runtimes, 'nativeaot') }}

      - name: Setup .NET for the base
        if: inputs.base != ''
        uses: ./.github/actions/setup-dotnet
        with:
          global-json-file: ./base/global.json

      - name: Check the base has benchmarks
        if: inputs.base != ''
        working-directory: base
        env:
          Base: ${{ inputs.base }}
        run: |
          if [[ ! -d performance/benchmarks ]]; then
            echo "::error::$Base has no performance/benchmarks: it is older than the layout this comparison needs."
            exit 1
          fi

      - name: Run the benchmarks of the base
        if: inputs.base != ''
        uses: ./.github/actions/run-benchmarks
        with:
          filter: ${{ inputs.filter }}
          runtimes: ${{ inputs.runtimes }}
          working-directory: base

      - name: Run the benchmarks
        uses: ./.github/actions/run-benchmarks
        with:
          filter: ${{ inputs.filter }}
          runtimes: ${{ inputs.runtimes }}

      - name: Summary
        run: |
          shopt -s nullglob
          reports=(artifacts/benchmarks/results/*-report-github.md)
          if (( ${#reports[@]} == 0 )); then
            echo "::error::No benchmark report was written. Either none matched the filter, or every one failed in the step above."
            exit 1
          fi
          for report in "${reports[@]}"; do
            name=$(basename "$report" -report-github.md)
            printf '## %s\n\n' "${name##*.}" >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Compare with the base
        if: inputs.base != ''
        continue-on-error: ${{ !inputs.strict }}
        env:
          Base: ${{ inputs.base }}
          Current: ${{ github.ref_name }}
          Strict: ${{ inputs.strict }}
        run: |
          args=(--base base/artifacts/benchmarks/results --diff artifacts/benchmarks/results)
          args+=(--base-name "${Base#v}" --diff-name "${Current#v}")
          [[ "$Strict" == "true" ]] && args+=(--strict)
          status=0
          dotnet tools/benchmarks/compare.cs "${args[@]}" > artifacts/benchmarks/results/comparison.md || status=$?
          cat artifacts/benchmarks/results/comparison.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: artifacts/benchmarks/results
          if-no-files-found: ignore
