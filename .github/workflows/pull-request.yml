name: Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      TUNIT_AGGREGATE_REPORTS: defer
      TUNIT_DISABLE_ARTIFACT_UPLOAD: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Restore
        run: dotnet restore tests.slnf

      - name: Build
        run: dotnet build tests.slnf --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test --solution tests.slnf --no-build --configuration Release
          --results-directory ${{ github.workspace }}/artifacts/test-results
          --no-artifact-post-processing
          --
          --report-trx
          --coverage
          --coverage-output-format cobertura

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.os }}
          path: |
            artifacts/test-results/*.trx
            artifacts/test-results/*.tunit-report.json
            artifacts/test-results/*.cobertura.xml
          retention-days: 14

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    env:
      MinimumLineCoverage: 85

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            global.json
            .config/dotnet-tools.json
            src/
            analyzers/
          sparse-checkout-cone-mode: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          path: artifacts/test-results
          pattern: test-results-*

      # Ubuntu first: the merged report keeps the first path of each file, and only the Linux paths exist here.
      - name: Merge coverage
        id: merge
        run: >
          dotnet tool exec dotnet-reportgenerator-globaltool --yes --allow-roll-forward
          --
          "-reports:artifacts/test-results/test-results-ubuntu-latest/*.cobertura.xml;artifacts/test-results/test-results-windows-latest/*.cobertura.xml"
          -targetdir:artifacts/coverage
          "-reporttypes:Html;MarkdownSummaryGithub;MarkdownAssembliesSummary"
          "-filefilters:-*.g.cs"
          "--minimumCoverageThresholds:lineCoverage=$MinimumLineCoverage"

      - name: Write summary
        if: ${{ !cancelled() && hashFiles('artifacts/coverage/SummaryGithub.md') != '' }}
        run: cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Write comment
        if: ${{ !cancelled() && hashFiles('artifacts/coverage/Summary.md') != '' }}
        env:
          Outcome: ${{ steps.merge.outcome }}
        run: |
          if [[ "$Outcome" == "success" ]]; then
            status="✅ At or above the minimum of $MinimumLineCoverage% of lines."
          else
            status="❌ Below the minimum of $MinimumLineCoverage% of lines."
          fi

          {
            echo "## Code coverage"
            echo
            echo "$status Linux and Windows are merged: a line is covered when either platform runs it."
            tail -n +2 artifacts/coverage/Summary.md
            echo
            echo "The full report is in the [run's artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } > artifacts/coverage/comment.md

      - name: Comment on the pull request
        if: >
          !cancelled()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('artifacts/coverage/comment.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: coverage
          path: artifacts/coverage/comment.md

      - name: Upload report
        if: ${{ !cancelled() && hashFiles('artifacts/coverage/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage
          retention-days: 14

  publish:
    name: Publish test results
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout tool manifest
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            global.json
            .config/dotnet-tools.json
          sparse-checkout-cone-mode: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          path: artifacts/test-results
          pattern: test-results-*

      - name: Merge TUnit reports
        run: >
          dotnet tool exec TUnit.Reporting.Tool --yes --allow-roll-forward
          --
          merge
          --directory artifacts/test-results
          --output artifacts/test-report.html
          --github-summary

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: artifacts/test-report.html
          retention-days: 14

      - name: Comment on the pull request
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d
        with:
          check_name: Tests
          files: artifacts/test-results/**/*.trx
          check_run: false
          job_summary: false
          action_fail_on_inconclusive: true
