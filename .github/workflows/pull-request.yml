name: Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
      template: ${{ steps.filter.outputs.template }}
      tools: ${{ steps.filter.outputs.tools }}

    steps:
      - name: Checkout the filters
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/filters.yml
          sparse-checkout-cone-mode: false

      - name: Filter the changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yml

  build:
    name: Build & test on ${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.build == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      TUNIT_AGGREGATE_REPORTS: defer
      TUNIT_DISABLE_ARTIFACT_UPLOAD: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          native-aot: true

      - name: Restore
        run: dotnet restore tests.slnf

      - name: Build
        run: dotnet build tests.slnf --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test --solution tests.slnf --no-build --configuration Release
          --results-directory ${{ github.workspace }}/artifacts/test-results
          --no-artifact-post-processing
          --
          --report-trx
          --coverage
          --coverage-output-format cobertura

      - name: Publish the allocation tests as NativeAOT
        run: dotnet publish tests/Khaos.Allocations.Tests --configuration Release

      - name: Test on NativeAOT
        shell: bash
        run: |
          exe=$(find artifacts/publish/Khaos.Allocations.Tests -type f \( -name KappaDuck.Khaos.Allocations.Tests -o -name KappaDuck.Khaos.Allocations.Tests.exe \) | head -1)
          [[ -n "$exe" ]] || { echo "::error::The published allocation tests were not found under artifacts/publish."; exit 1; }
          "$exe" --results-directory "${{ github.workspace }}/artifacts/test-results" --report-trx --report-trx-filename KappaDuck.Khaos.Allocations.Tests-nativeaot.trx

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.os }}
          path: |
            artifacts/test-results/*.trx
            artifacts/test-results/*.tunit-report.json
            artifacts/test-results/*.cobertura.xml
          retention-days: 14

  template:
    name: Template
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.template == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the template
        uses: ./.github/actions/check-template

  tools:
    name: Tools
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.tools == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tools
        uses: ./.github/actions/check-tools

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    env:
      MinimumLineCoverage: 85

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            global.json
            .config/dotnet-tools.json
            .github/actions/
            src/
            analyzers/
          sparse-checkout-cone-mode: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          path: artifacts/test-results
          pattern: test-results-*

      - name: Merge coverage
        id: merge
        run: >
          dotnet tool exec dotnet-reportgenerator-globaltool --yes --allow-roll-forward
          --
          "-reports:artifacts/test-results/test-results-ubuntu-latest/*.cobertura.xml;artifacts/test-results/test-results-windows-latest/*.cobertura.xml"
          -targetdir:artifacts/coverage
          "-reporttypes:Html;MarkdownSummaryGithub;MarkdownAssembliesSummary"
          "-filefilters:-*.g.cs"
          "--minimumCoverageThresholds:lineCoverage=$MinimumLineCoverage"

      - name: Write summary
        if: ${{ !cancelled() && hashFiles('artifacts/coverage/SummaryGithub.md') != '' }}
        run: cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Write comment
        if: ${{ !cancelled() && hashFiles('artifacts/coverage/Summary.md') != '' }}
        env:
          Outcome: ${{ steps.merge.outcome }}
        run: |
          if [[ "$Outcome" == "success" ]]; then
            status="✅ At or above the minimum of $MinimumLineCoverage% of lines."
          else
            status="❌ Below the minimum of $MinimumLineCoverage% of lines."
          fi

          {
            echo "## Code coverage"
            echo
            echo "$status Linux and Windows are merged: a line is covered when either platform runs it."
            tail -n +2 artifacts/coverage/Summary.md
            echo
            echo "The full report is in the [run's artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } > artifacts/coverage/comment.md

      - name: Comment on the pull request
        if: >
          !cancelled()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('artifacts/coverage/comment.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          path: artifacts/coverage/comment.md

      - name: Upload report
        if: ${{ !cancelled() && hashFiles('artifacts/coverage/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage
          retention-days: 14

  publish:
    name: Publish test results
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout tool manifest
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            global.json
            .config/dotnet-tools.json
            .github/actions/
          sparse-checkout-cone-mode: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          path: artifacts/test-results
          pattern: test-results-*

      - name: Merge TUnit reports
        run: >
          dotnet tool exec TUnit.Reporting.Tool --yes --allow-roll-forward
          --
          merge
          --directory artifacts/test-results
          --output artifacts/test-report.html
          --github-summary

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: artifacts/test-report.html
          retention-days: 14

      - name: Comment on the pull request
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        with:
          check_name: Tests
          files: artifacts/test-results/**/*.trx
          check_run: false
          job_summary: false
          action_fail_on_inconclusive: true

  checks:
    name: Checks
    needs: [changes, build, template, tools, coverage, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the results of the jobs
        env:
          Results: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$Results")
          if [[ -n "$failed" ]]; then
            while read -r job; do echo "::error::$job"; done <<< "$failed"
            exit 1
          fi
